name: Deploy to Cloudflare Pages
on:
  push:
    branches: [ main, master ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install and Build
        if: hashFiles('package.json') != ''
        run: |
          npm install
          if jq -e '.scripts.build' package.json > /dev/null; then
            npm run build
          fi

      - name: Determine Deploy Directory
        id: dir
        run: |
          if [ -d "dist" ]; then echo "dir=dist" >> $GITHUB_OUTPUT;
          elif [ -d "build" ]; then echo "dir=build" >> $GITHUB_OUTPUT;
          elif [ -d "out" ]; then echo "dir=out" >> $GITHUB_OUTPUT;
          elif [ -d "public" ]; then echo "dir=public" >> $GITHUB_OUTPUT;
          else echo "dir=." >> $GITHUB_OUTPUT; fi

      - name: Prevent Search Engine Indexing
        run: |
          echo -e "\n/*\n  X-Robots-Tag: noindex" >> ${{ steps.dir.outputs.dir }}/_headers

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "b584c783dc0b5b992362539b91ac60ec"
        run: |
          npx wrangler@latest pages deploy ${{ steps.dir.outputs.dir }} --project-name="brand-guidelines" --branch="$GITHUB_REF_NAME"
